name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch makes the previous run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1  # no floating v10 tag is published
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        # --locked fails if uv.lock is out of step with pyproject.toml, rather
        # than quietly resolving something different from local development.
        run: uv sync --locked

      - name: Run tests
        # No OPENAI_API_KEY: the tests set a placeholder before importing the
        # app and never reach a model.
        run: uv run pytest -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        # next typegen first: LayoutProps and friends are generated types, and
        # nothing has run a build yet at this point.
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        # Catches what unit tests cannot: a page that fails to compile or
        # prerender.
        run: npm run build
