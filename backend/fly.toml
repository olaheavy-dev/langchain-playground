# Deploy: fly launch --no-deploy  (once, to claim an app name)
#         fly secrets set OPENAI_API_KEY=sk-...  CORS_ORIGINS='["https://your-frontend.vercel.app"]'
#         fly deploy
#
# Set a spend cap on the OpenAI key first. These endpoints are unauthenticated
# and every one of them costs money; the rate limiter caps a caller's rate, not
# your monthly bill.

app = "langchain-playground-api"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  # Scale to zero between visits: a portfolio API is idle almost always, and a
  # cold start costs a few seconds against a request that already takes three.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.checks]
    [http_service.checks.health]
      path = "/health"
      interval = "30s"
      timeout = "5s"

[[vm]]
  # The vector store is ten sentences and lives in memory; nothing here is
  # hungry.
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
