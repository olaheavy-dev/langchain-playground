[project]
name = "langchain-playground-backend"
version = "0.1.0"
description = "FastAPI backend serving the LangChain agent patterns"
requires-python = ">=3.13"
dependencies = [
    "langchain[openai]>=1.3.15",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.6.0",
    "langchain-community>=0.4.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# So "from app... " resolves without installing the package.
pythonpath = ["."]
# Every test here is a coroutine, so mark them automatically rather than
# decorating each one.
asyncio_mode = "auto"
